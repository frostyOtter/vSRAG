[project]
name = "datamate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "frostyOtter", email = "binary.hamlet147@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
datamate = "datamate:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260914",
    "pyright>=1.1.414",
    "ruff>=0.17.2",
]
